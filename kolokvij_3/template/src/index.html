<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadingList</title>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/index.js"></script>
</head>
<body>

    <!-- Zadatak 1: Navigacijska traka (4 boda)
         - Boja pozadine: bg-dark
         - Sjena: shadow
         - Ikona: bi-book-half (u text-warning boji)
         - Naslov branda: ReadingList
    -->


    <main class="container mb-5">
        <!-- Zadatak 2: Prototip kartice (16 bodova)
             - Jedna kartica s naslovom, datumom, statusom i gumbima
             - Zaobljenost: rounded-4, sjena: shadow-sm, obrub: border
             - Gumbi: rounded-pill flex-fill
             - Ikona statusa: bi-bookmark-check-fill ili bi-bookmark-x-fill
             - Responzivnost: 1 stupac na malom, 2 na srednjem, 3 na velikom ekranu
             - Nakon izrade, zakomentirajte prototip!
        -->

        <div id="books-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 w-100">
        </div>
    </main>

</body>
</html>
