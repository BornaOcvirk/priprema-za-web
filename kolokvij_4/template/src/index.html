<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/index.js"></script>

<body class="bg-light">

    <!-- Zadatak 1: Navigacijska traka (4 boda)
         - Tamna navigacija u boji bg-primary koja ostaje na vrhu pri skrolanju: navbar-dark sticky-top
         - Sjena: shadow-sm
         - Lijevo: ikona bi-basket2-fill + naslov branda PantryCheck
         - Desno: tekst "Kućna smočnica" (navbar-text)
    -->


    <main class="container my-4">
        <!-- Zadatak 2: Prototip tablice (16 bodova)
             - Kartica (card border-0 shadow rounded-3 overflow-hidden) u kojoj je tablica
             - Tablica: table table-hover align-middle mb-0, zaglavlje thead table-light
             - Stupci: Namirnica | Rok trajanja | Količina | Akcije
             - JEDAN redak (tr) s primjerom namirnice
             - Količina u znački: badge rounded-pill bg-success
             - Gumbi u btn-group btn-group-sm: [−] [+] btn-outline-secondary, [smeće] btn-outline-danger
             - Responzivnost: table-responsive, stupac "Rok trajanja" skriven na malom ekranu,
               tablica u col-12 col-lg-8 centrirana unutar row justify-content-center
             - tbody mora imati id="items-body"
             - Nakon izrade, zakomentirajte SAMO prototip retka (tr) - tablica ostaje!
        -->

    </main>

</body>
